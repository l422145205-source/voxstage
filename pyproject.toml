[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "voxstage"
version = "0.1.0"
description = "Constraint-guided dialogue production and audio verification agent"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scipy>=1.12,<2", "pydantic>=2.10,<3", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "requests>=2.32,<3", "imageio-ffmpeg>=0.6,<0.7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
plots = ["matplotlib>=3.9,<4"]

[project.scripts]
voxstage = "voxstage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
voxstage = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
